# リリースワークフロー
#
# 実行は手動のみ（Actions → Release → Run workflow）。 **`mode` で 2 段階に分ける**。
#
#   dry-run … 配布物の作成と検証だけを行う（**公開もタグ作成もしない**。 内容は Summary に出す）
#   release … 同じコミットの dry-run が成功していることを前提に、承認 → 配布 → **タグと Release** の順で進む
#
# 設計の要点:
#   - **版は人が `Directory.Build.props` へ書いてコミットしておく**（自動採番しない）。
#     入力 `version` は確認用であり、ツリーの値と一致しなければ失敗する。
#   - **タグと GitHub Release は、配布物の作成と承認が終わった後にだけ作る**（`gh release create --target`）。
#     失敗してもタグを消費しない。
#   - **`release` ジョブは `environment: release`（Required reviewers）で承認を要求する**。
#   - 配布物には **SBOM（CycloneDX）** を添付する（使った依存を配布物から辿れるようにする）。
#
# 前提検証: ブランチ（`releaseBranches`）/ ゲート（`build.yml` の成功実行）/ semver / 系列 / タグ未作成。
# 規則の所有者は .github/RELEASE.md。
name: Release

# 実行一覧で dry-run と release を区別する（release 側は dry-run の成功を確認するため、この名前を見る）
run-name: ${{ inputs.mode == 'dry-run' && 'DryRun' || 'Release' }} ${{ github.ref_name }} ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run（作成と検証のみ）/ release（承認 → 配布 → タグ）'
        required: true
        type: choice
        options: [dry-run, release]
        default: dry-run
      version:
        description: '任意: 公開する版（Directory.Build.props の <Version> と一致しなければ失敗します。 dry-run では省略可）'
        required: false
        type: string

# リリース処理は同時に 1 つだけ実行する
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 前提検証
  # ────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dry-run の実行結果の参照
      actions: read
    outputs:
      dry_run: ${{ steps.verify.outputs.dry_run }}
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      notes_start_tag: ${{ steps.verify.outputs.notes_start_tag }}
      mark_latest: ${{ steps.verify.outputs.mark_latest }}
      gate_workflow: ${{ steps.config.outputs.gate_workflow }}
      version_file: ${{ steps.config.outputs.version_file }}
      product: ${{ steps.config.outputs.product }}
      release_notes: ${{ steps.config.outputs.release_notes }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # リリース設定（バージョンファイル・表示名・説明・ブランチ・ゲート）は release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # 現在どこまでリリースされているか（バージョン・タグ・GitHub Release・配布物）を Summary へ表示する
      - name: 現在のバージョン状況を表示
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: ./.github/scripts/show-current-versions.ps1 -Branch $env:BRANCH

      - name: 版と前提を検証
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          VERSION_FILE: ${{ steps.config.outputs.version_file }}
          GATE_WORKFLOW: ${{ steps.config.outputs.gate_workflow }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dryRun = $env:MODE -eq 'dry-run'
          "dry_run=$($dryRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          # 版はコミット済みの値を使う（ワークフローで書き換えない）
          $text = [IO.File]::ReadAllText($env:VERSION_FILE, [Text.UTF8Encoding]::new($false))
          $m = [regex]::Match($text, '<Version>(?<v>[^<]+)</Version>')
          if (-not $m.Success) { throw "$($env:VERSION_FILE) に <Version> がありません" }
          $committed = $m.Groups['v'].Value.Trim()

          $input = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { '' }
          if (-not $dryRun -and $input -and $input -ne $committed) {
            throw "入力 $input がコミット済みの版 $committed と一致しません（版はリリース前にコミットしてください）"
          }
          $version = if ($input) { $input } else { $committed }
          Write-Host "対象の版: $version（コミット済み: $committed / モード: $($env:MODE)）"

          # semver・ブランチ・系列・タグ未作成の検証（規則は version.ps1 と verify-release-version.ps1 が持つ）
          $info = & ./.github/scripts/verify-release-version.ps1 -Version $version -Branch $env:BRANCH -Mode $env:MODE | ConvertFrom-Json

          # ゲート（build.yml）の成功実行が、このコミットに対して存在すること
          $gateRuns = @(gh run list --repo $env:REPO --workflow $env:GATE_WORKFLOW --commit $env:SHA --limit 50 --json conclusion | ConvertFrom-Json)
          if (@($gateRuns | Where-Object { $_.conclusion -eq 'success' }).Count -eq 0) {
            throw "コミット $($env:SHA) に対する $($env:GATE_WORKFLOW) の成功実行がありません。先に push して Build を成功させてください。"
          }

          # release は「同じコミットの dry-run が成功している」ことを前提にする
          # （表示名は run-name。 name はワークフロー名 `Release` のため判定に使えない）
          if (-not $dryRun) {
            $runs = @(gh run list --repo $env:REPO --workflow release.yml --commit $env:SHA --limit 50 --json displayTitle,conclusion | ConvertFrom-Json)
            if (@($runs | Where-Object { $_.displayTitle -like 'DryRun*' -and $_.conclusion -eq 'success' }).Count -eq 0) {
              throw "このコミット（$($env:SHA)）の dry-run の成功実行がありません。先に mode=dry-run で実行してください。"
            }
          }

          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "tag=$($info.tag)" >> $env:GITHUB_OUTPUT
          "prerelease=$($info.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "notes_start_tag=$($info.notesStartTag)" >> $env:GITHUB_OUTPUT
          "mark_latest=$($info.markLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: 対象をまとめ
        shell: pwsh
        env:
          SUMMARY_MODE: ${{ inputs.mode }}
          SUMMARY_VERSION: ${{ steps.verify.outputs.version }}
          SUMMARY_TAG: ${{ steps.verify.outputs.tag }}
          SUMMARY_BRANCH: ${{ github.ref_name }}
          SUMMARY_SHA: ${{ github.sha }}
        run: |
          $message = @"

          ### リリース対象

          - モード: ``$env:SUMMARY_MODE``
          - 版: ``$env:SUMMARY_VERSION``
          - タグ: ``$env:SUMMARY_TAG``
          - 実行ブランチ: ``$env:SUMMARY_BRANCH``
          - コミット: ``$env:SUMMARY_SHA``
          "@
          $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ────────────────────────────────────────────────────────────
  # 2. SBOM（CycloneDX）を作る（dry-run でも作って検証する）
  # ────────────────────────────────────────────────────────────
  sbom:
    needs: verify
    # Windows を対象にしたプロジェクト（`net10.0-windows…`）は Linux では復元できない
    # （`NETSDK1100`。 実測 2026-10-26）ため、ビルドと同じランナーで作る
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: SBOM を作成
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRODUCT: ${{ needs.verify.outputs.product }}
        run: |
          # ツールの版は .config/dotnet-tools.json が単一所有する（CI とローカルで同じものを使う）
          & pwsh -NoProfile -File buildScript/generateSbom.ps1 -Output 'sbom' -Version $env:VERSION -Product $env:PRODUCT
          if ($LASTEXITCODE -ne 0) { throw "SBOM の作成に失敗しました（exit $LASTEXITCODE）" }
          Get-ChildItem -Path 'sbom' -File | ForEach-Object { $_.Name }

      - name: SBOM を保管
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────
  # 3. 配布物の作成（dry-run でも実行して、作れることを確かめる）
  # ────────────────────────────────────────────────────────────
  publish:
    needs: [verify, sbom]
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      # 版はコミット済みの値（publish.yml が作業ツリーへ適用するが、同じ値なので実質は検証になる）
      version: ${{ needs.verify.outputs.version }}

  # ────────────────────────────────────────────────────────────
  # 4. タグと GitHub Release（release のみ。 承認 → 作成の順）
  # ────────────────────────────────────────────────────────────
  release:
    needs: [verify, publish, sbom]
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 承認されたジョブだけがタグと Release を作る（配布物は既に作成済みなので、ここは不可逆な操作だけ）
    environment: release
    permissions:
      contents: write
    steps:
      - name: 成果物をダウンロード
        uses: actions/download-artifact@v7
        with:
          path: assets
          # 配布物と SBOM を 1 つのフォルダへ集約する
          merge-multiple: true

      - name: GitHub Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRODUCT: ${{ needs.verify.outputs.product }}
          RELEASE_NOTES: ${{ needs.verify.outputs.release_notes }}
          NOTES_START_TAG: ${{ needs.verify.outputs.notes_start_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          MARK_LATEST: ${{ needs.verify.outputs.mark_latest }}
          SHA: ${{ github.sha }}
        run: |
          $assets = @(Get-ChildItem -Path 'assets' -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -eq 0) { throw '添付する成果物がありません。' }

          # タグは gh に作成させる（--target で公開対象コミットを指定する。 失敗してもタグは残らない）
          $ghArgs = @(
            'release', 'create', $env:TAG,
            '--title', "$env:PRODUCT $env:VERSION",
            '--target', $env:SHA,
            '--generate-notes'
          )

          if ($env:RELEASE_NOTES) { $ghArgs += @('--notes', $env:RELEASE_NOTES) }
          if ($env:NOTES_START_TAG) { $ghArgs += @('--notes-start-tag', $env:NOTES_START_TAG) }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          if ($env:MARK_LATEST -ne 'true') { $ghArgs += @('--latest=false') }

          $ghArgs += $assets

          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release の作成に失敗しました（exit $LASTEXITCODE）" }

          Write-Host "リリースを作成しました: $env:TAG（添付 $($assets.Count) 件）"
