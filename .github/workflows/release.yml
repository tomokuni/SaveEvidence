# リリースワークフロー
#
# 実行契機は次のとおり。
#   main 向け Pull Request … **前提検証だけを自動で実行する**（配布物は作らない。 版・タグ・CHANGELOG の
#                             不備をマージ前に見つける）。 実行名は `DryRun <ブランチ> <SHA>`。
#   手動実行（Actions → Release → Run workflow） … **`mode` で 3 段階に分ける**。
#     dry-run       … 検証だけを行う（配布物も SBOM も作らない。 最も軽い）
#     dry-run-pack  … 検証 + 配布物の作成と検証（`publish.yml`）。 **公開もタグ作成もしない**
#     release       … 同じコミットの dry-run が成功していることを前提に、承認 → 配布 → **タグと Release** の順で進む
#
# 設計の要点:
#   - **版は人が `Directory.Build.props` へ書いてコミットしておく**（自動採番しない）。
#     入力 `version` は確認用であり、ツリーの値と一致しなければ失敗する。
#   - **`CHANGELOG.md` に「未リリース」の見出しを残さない**（公開した版の変更が未リリースのまま残らないようにする）。
#   - **タグと GitHub Release は、配布物の作成と承認が終わった後にだけ作る**（`gh release create --target`）。
#     失敗してもタグを消費しない。
#   - **`release` ジョブは `environment: release`（Required reviewers）で承認を要求する**。
#   - 配布物には **SBOM（CycloneDX）** を添付する（使った依存を配布物から辿れるようにする）。
#   - **配布物には由来の証明（build provenance）を付ける**（`actions/attest-build-provenance`。
#     どのワークフロー・どのコミットが作ったかを後から検証できる）。
#
# 前提検証: ブランチ（`releaseBranches`）/ semver / 系列 / タグ未作成 / dry-run の成功。
# **`build.yml` の成功実行は探さない**（build.yml は Pull Request でだけ走り、マージ後のコミットには
# 実行が無い。 マージの前提は ruleset の必須チェック `ci` が保証する）。
# 規則の所有者は .github/RELEASE.md。
name: Release

# 実行一覧で dry-run と release を区別する（release 側は dry-run の成功を確認するため、この名前を見る）
run-name: ${{ (github.event_name == 'pull_request' || inputs.mode == 'dry-run') && 'DryRun' || (inputs.mode == 'dry-run-pack' && 'DryRun+Pack' || 'Release') }} ${{ github.ref_name }} ${{ github.sha }}

on:
  # **main 向け Pull Request では前提検証を自動実行する**（マージ後に版やタグの不備へ気づくのを防ぐ）
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run（検証のみ）/ dry-run-pack（検証 + 配布物の作成と検証）/ release（承認 → 配布 → タグ）'
        required: true
        type: choice
        options: [dry-run, dry-run-pack, release]
        default: dry-run
      version:
        description: '任意: 公開する版（Directory.Build.props の <Version> と一致しなければ失敗します。 dry-run では省略可）'
        required: false
        type: string

# 公開は同時に 1 つだけ、Pull Request の検証は PR ごとに並行してよい
# （`release` で直列にすると、PR の検証が公開の待ち行列へ入ってしまう）。
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 前提検証
  # ────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dry-run の実行結果の参照
      actions: read
    outputs:
      dry_run: ${{ steps.verify.outputs.dry_run }}
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      notes_start_tag: ${{ steps.verify.outputs.notes_start_tag }}
      mark_latest: ${{ steps.verify.outputs.mark_latest }}
      gate_workflow: ${{ steps.config.outputs.gate_workflow }}
      version_file: ${{ steps.config.outputs.version_file }}
      product: ${{ steps.config.outputs.product }}
      release_notes: ${{ steps.config.outputs.release_notes }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # リリース設定（バージョンファイル・表示名・説明・ブランチ・ゲート）は release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # 公開した版の変更が「未リリース」のまま残らないようにする（規則は .github/RELEASE.md）
      - name: CHANGELOG の見出しを検証する
        shell: pwsh
        env:
          VERSION_FILE: ${{ steps.config.outputs.version_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = [IO.File]::ReadAllLines('CHANGELOG.md', [Text.UTF8Encoding]::new($false))

          $unreleased = @($lines | Where-Object { $_ -match '^##\s+未リリース' })
          if ($unreleased.Count -gt 0) {
            throw "CHANGELOG.md に「$($unreleased[0])」が残っています。 見出しを「## <版>（<公開日>）」へ確定してコミットしてください（手順は .github/RELEASE.md）。"
          }

          # 版との一致は警告に留める（見出しの書き方は 1 つに決まらない）
          $first = @($lines | Where-Object { $_ -match '^## ' })[0]
          $props = [IO.File]::ReadAllText($env:VERSION_FILE, [Text.UTF8Encoding]::new($false))
          $version = [regex]::Match($props, '<Version>([^<]+)</Version>').Groups[1].Value.Trim()
          if ($version -and -not $first.Contains($version)) {
            Write-Host "::warning::CHANGELOG.md の先頭の見出し（$first）に版 $version が含まれていません。"
          }
          Write-Host "CHANGELOG の見出し: $first"

      # 現在どこまでリリースされているか（バージョン・タグ・GitHub Release・配布物）を Summary へ表示する
      - name: 現在のバージョン状況を表示
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: ./.github/scripts/show-current-versions.ps1 -Branch $env:BRANCH

      - name: 版と前提を検証
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          # Pull Request では**マージ先**のブランチで判定する（`github.ref_name` は `<番号>/merge` になる）
          BRANCH: ${{ github.base_ref || github.ref_name }}
          VERSION_FILE: ${{ steps.config.outputs.version_file }}
          GATE_WORKFLOW: ${{ steps.config.outputs.gate_workflow }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Pull Request は常に dry-run（`inputs.mode` は workflow_dispatch でしか入らない）。
          # dry-run-pack も配布物を作るだけで公開しないため、検証スクリプトへは dry-run として渡す
          $dryRun = ($env:EVENT_NAME -eq 'pull_request') -or ($env:MODE -eq 'dry-run') -or ($env:MODE -eq 'dry-run-pack')
          # 検証スクリプトへは必ず dry-run / release のどちらかを渡す（PR では inputs.mode が空になる）
          $mode = if ($dryRun) { 'dry-run' } else { 'release' }
          "dry_run=$($dryRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          # 版はコミット済みの値を使う（ワークフローで書き換えない）
          $text = [IO.File]::ReadAllText($env:VERSION_FILE, [Text.UTF8Encoding]::new($false))
          $m = [regex]::Match($text, '<Version>(?<v>[^<]+)</Version>')
          if (-not $m.Success) { throw "$($env:VERSION_FILE) に <Version> がありません" }
          $committed = $m.Groups['v'].Value.Trim()

          $input = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { '' }
          if (-not $dryRun -and $input -and $input -ne $committed) {
            throw "入力 $input がコミット済みの版 $committed と一致しません（版はリリース前にコミットしてください）"
          }
          $version = if ($input) { $input } else { $committed }
          Write-Host "対象の版: $version（コミット済み: $committed / モード: $($env:MODE)）"

          # semver・ブランチ・系列・タグ未作成の検証（規則は version.ps1 と verify-release-version.ps1 が持つ）
          $info = & ./.github/verify/verify-release-version.ps1 -Version $version -Branch $env:BRANCH -Mode $mode | ConvertFrom-Json

          # **build.yml の成功実行は探さない**（build.yml は Pull Request でだけ走り、マージ後のコミットには
          # 実行が無い。 マージの前提は ruleset の必須チェック `ci` が保証する）。

          # release は「同じコミットの dry-run が成功している」ことを前提にする
          # （表示名は run-name。 name はワークフロー名 `Release` のため判定に使えない）
          if (-not $dryRun) {
            $runs = @(gh run list --repo $env:REPO --workflow release.yml --commit $env:SHA --limit 50 --json displayTitle,conclusion | ConvertFrom-Json)
            if (@($runs | Where-Object { $_.displayTitle -like 'DryRun*' -and $_.conclusion -eq 'success' }).Count -eq 0) {
              throw "このコミット（$($env:SHA)）の dry-run の成功実行がありません。先に mode=dry-run で実行してください。"
            }
          }

          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "tag=$($info.tag)" >> $env:GITHUB_OUTPUT
          "prerelease=$($info.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "notes_start_tag=$($info.notesStartTag)" >> $env:GITHUB_OUTPUT
          "mark_latest=$($info.markLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          # dry-run で「同じ版」の警告だけを出して続行したか（公開すると失敗する状態か）
          "already_released=$($info.alreadyReleased.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: 対象をまとめ
        shell: pwsh
        env:
          SUMMARY_MODE: ${{ inputs.mode }}
          SUMMARY_VERSION: ${{ steps.verify.outputs.version }}
          SUMMARY_TAG: ${{ steps.verify.outputs.tag }}
          SUMMARY_BRANCH: ${{ github.ref_name }}
          SUMMARY_SHA: ${{ github.sha }}
          SUMMARY_ALREADY_RELEASED: ${{ steps.verify.outputs.already_released }}
        run: |
          $lines = @(
            '',
            '### リリース対象',
            '',
            "- モード: ``$env:SUMMARY_MODE``",
            "- 版: ``$env:SUMMARY_VERSION``",
            "- タグ: ``$env:SUMMARY_TAG``",
            "- 実行ブランチ: ``$env:SUMMARY_BRANCH``",
            "- コミット: ``$env:SUMMARY_SHA``"
          )

          # 同じ版が公開済みのまま dry-run した場合（このままでは公開できない）
          if ($env:SUMMARY_ALREADY_RELEASED -eq 'true') {
            $lines += ''
            $lines += '> [!WARNING]'
            $lines += '> この版は既に公開済みです（同じ版は再リリースできません）。'
            $lines += '> dry-run は「それ以外の条件」を確認するために続行しました。 公開するには版を上げてコミットしてください。'
          }

          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ────────────────────────────────────────────────────────────
  # 2. SBOM（CycloneDX）を作る（dry-run-pack と release で作る）
  # ────────────────────────────────────────────────────────────
  sbom:
    needs: verify
    # Pull Request と dry-run（検証のみ）では作らない
    if: github.event_name != 'pull_request' && inputs.mode != 'dry-run'
    # Windows を対象にしたプロジェクト（`net10.0-windows…`）は Linux では復元できない
    # （`NETSDK1100`。 実測 2026-10-26）ため、ビルドと同じランナーで作る
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # ツール（CycloneDX）の取得と復元をキャッシュする（初回は約 2 分かかる。 実測 2026-10-26）
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: SBOM を作成
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRODUCT: ${{ needs.verify.outputs.product }}
        run: |
          # ツールの版は .config/dotnet-tools.json が単一所有する（CI とローカルで同じものを使う）
          & pwsh -NoProfile -File .github/scripts/generateSbom.ps1 -Output 'sbom' -Version $env:VERSION -Product $env:PRODUCT
          if ($LASTEXITCODE -ne 0) { throw "SBOM の作成に失敗しました（exit $LASTEXITCODE）" }
          Get-ChildItem -Path 'sbom' -File | ForEach-Object { $_.Name }

      - name: SBOM を保管
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────
  # 3. 配布物の作成（dry-run-pack と release で作る）
  # ────────────────────────────────────────────────────────────
  # **sbom と並列に走らせる**（配布物は SBOM を使わない。 直列にすると SBOM の約 2 分を毎回待つ。 実測 2026-10-26）
  publish:
    needs: verify
    # Pull Request と dry-run（検証のみ）では作らない
    if: github.event_name != 'pull_request' && inputs.mode != 'dry-run'
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      # 版はコミット済みの値（publish.yml が作業ツリーへ適用するが、同じ値なので実質は検証になる）
      version: ${{ needs.verify.outputs.version }}

  # ────────────────────────────────────────────────────────────
  # 4. タグと GitHub Release（release のみ。 承認 → 作成の順）
  # ────────────────────────────────────────────────────────────
  release:
    needs: [verify, publish, sbom]
    if: github.event_name != 'pull_request' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 承認されたジョブだけがタグと Release を作る（配布物は既に作成済みなので、ここは不可逆な操作だけ）
    environment: release
    permissions:
      contents: write
      # 成果物の由来（provenance）を証明する（署名は GitHub の OIDC で行う）
      id-token: write
      attestations: write
    steps:
      # gh の `--generate-notes` はローカルの git リポジトリ（履歴とタグ）を読むため、チェックアウトする。
      # 浅い取得では `--notes-start-tag` の範囲を辿れないため全履歴を取る。
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 成果物をダウンロード
        uses: actions/download-artifact@v8
        with:
          path: assets
          # 配布物と SBOM を 1 つのフォルダへ集約する
          merge-multiple: true

      # **由来の証明**（どのワークフロー・どのコミットが作ったかを検証できるようにする）。
      # 配布物は取り消せないため、後から出所を確かめられる状態にする（規則は .github/RELEASE.md）。
      - name: 由来を証明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'assets/**'

      - name: GitHub Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRODUCT: ${{ needs.verify.outputs.product }}
          RELEASE_NOTES: ${{ needs.verify.outputs.release_notes }}
          NOTES_START_TAG: ${{ needs.verify.outputs.notes_start_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          MARK_LATEST: ${{ needs.verify.outputs.mark_latest }}
          SHA: ${{ github.sha }}
        run: |
          $assets = @(Get-ChildItem -Path 'assets' -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -eq 0) { throw '添付する成果物がありません。' }

          # タグは gh に作成させる（--target で公開対象コミットを指定する。 失敗してもタグは残らない）
          $ghArgs = @(
            'release', 'create', $env:TAG,
            '--title', "$env:PRODUCT $env:VERSION",
            '--target', $env:SHA,
            '--generate-notes'
          )

          if ($env:RELEASE_NOTES) { $ghArgs += @('--notes', $env:RELEASE_NOTES) }
          if ($env:NOTES_START_TAG) { $ghArgs += @('--notes-start-tag', $env:NOTES_START_TAG) }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          if ($env:MARK_LATEST -ne 'true') { $ghArgs += @('--latest=false') }

          $ghArgs += $assets

          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release の作成に失敗しました（exit $LASTEXITCODE）" }

          Write-Host "リリースを作成しました: $env:TAG（添付 $($assets.Count) 件）"
