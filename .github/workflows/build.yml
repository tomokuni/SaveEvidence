# ビルドワークフロー
#
# 実行契機は次のとおり。
#   main への push（マージ含む） … 必ず実行する（main へは PR でのみ反映する。 ruleset `Protect main`）
#   main 向け Pull Request       … 必ず実行する（必須チェック `build`）
#   dev への push                … 必ず実行する（開発〜dry-run までの確認は dev で行う）
#   手動実行（workflow_dispatch）  … 任意のブランチで確認する場合に使用する
#
# 復元・検証（Release）を実行する（配布物の作成と公開は行わない）。
# **文書（.md）だけの変更では復元・ビルド・テストを省略し、走査（verifyDocs.ps1）だけを実行する**
# （実測 2026-10-27: 文書だけの push に 2 分 43 秒かけていた。 コードの判定は core.quotepath=false で行う）。
# 検証の内容は buildScript/verify.ps1 が単一所有し、合否基準は .github/検証手順.md が定める。
#
# 本ワークフローは「検証」だけを行い、配布物の作成は release.yml が publish.yml を通じて行う。
# この実行結果はリリースの前提（ゲート）になる。Release ワークフローは、リリース対象コミットに対する
# 本ワークフローの成功実行が存在することを確認してから Release を作成する。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# dotnet の対象（ソリューション ファイル）は release-config.json の solutionFile が単一所有する。
# .NET SDK はランナー イメージに含まれる最新版をそのまま使う（actions/setup-dotnet は使わない）。
# イメージの SDK は C:\Program Files\dotnet に入り PATH も通っているため、そのまま dotnet を実行できる。
# global.json は rollForward: latestFeature のため、イメージの最新 10.0 SDK で要件を満たす。
# setup-dotnet を使うと「10.0 の最新」を取得しようとしてイメージに無い版を毎回ダウンロードする。
# キャッシュは NuGet の復元と npm（markdownlint）だけを対象にする。
# 走査（文書とコード）はビルド・テストと重ねて実行する（入口が背景で起動する）。
#
# テストは xunit.v3 + Microsoft.NET.Test.Sdk（VSTest）で実行するため、`dotnet test <ソリューション>` で
# 全テストプロジェクトを実行できる（Microsoft.Testing.Platform の --solution は不要）。
#
# 以降の検証ステップは verify.ps1 が実行する（復元だけを先に行い、キャッシュと --no-restore を効かせる）。
#
# Windows 専用（Win32 API の P/Invoke を含む）のため windows-latest で実行する。
#
# README の「build」バッジはこのワークフローの status を表示する（badge.svg?branch=main）。
name: Build

on:
  push:
    # main への直接 push は ruleset `Protect main` が拒否する（main は PR でのみ更新する）
    # main への push はマージ後の検証として必ず実行する（公開は main でのみ行う）
    # dev は作業ブランチ。 push で検証する（開発〜dry-run までの確認を dev で行うため）
    branches: [main, dev]
  pull_request:
    branches: [main]
  # 手動実行（dev など任意のブランチでの確認、およびバージョンコミットの検証に使用する）
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # テストが停止した場合に 6 時間（既定）待たないための上限。
    # 通常はビルド + テストで 3 分程度のため、超過は異常とみなして失敗させる
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          # 変更の判定に使う（既定の深さ 1 では直前のコミットが無く git diff が失敗する）
          fetch-depth: 0

      # 対象のソリューション ファイルは release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # **文書（.md）だけの変更では復元もビルドもテストも要らない**（実測 2026-10-27: 文書だけの push に
      # 2 分 43 秒かけていた。 文書の検査は buildScript/verifyDocs.ps1 が持つ）。
      # 判定できない場合（初回 push・タグ・手動実行）は**コードの変更として扱う**（取りこぼしを避ける）。
      - name: 変更の種類を判定
        id: kind
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 変更の一覧を取る。 **取れなければ「コードの変更」として扱う**（取りこぼして
          # 検証を飛ばすより、余分に走らせる方が安全）。
          # core.quotepath=false: 非 ASCII のパスを引用させない（引用されると .md 判定を取りこぼす）。
          function Get-ChangedFiles {
            if ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_REF) {
              git fetch --no-tags origin $env:BASE_REF 2>&1 | Out-Null
              return @(git -c core.quotepath=false diff --name-only "origin/$($env:BASE_REF)...$env:HEAD_SHA" 2>&1)
            }
            if ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
              # push は **2 点（A B）** で比べる。 3 点（A...B）は共通の祖先からの差分になるため、
              # 履歴を書き換えた push では before 側だけにあった変更（削除・巻き戻し）を取りこぼす
              # （実測 2026-10-28: レビューで指摘）。
              return @(git -c core.quotepath=false diff --name-only "$($env:BEFORE_SHA)" "$($env:HEAD_SHA)" 2>&1)
            }
            return $null
          }

          $files = $null
          try {
            $files = Get-ChangedFiles
          }
          catch {
            Write-Host "変更の判定に失敗しました（コードの変更として扱います）: $($_.Exception.Message)"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "git diff が終了コード $LASTEXITCODE で失敗しました（コードの変更として扱います）"
            $files = $null
          }

          if ($null -eq $files -or $files.Count -eq 0) {
            # 判定できない（初回 push・タグ・手動実行・git の失敗・差分なし）→ コードの変更として扱う
            "code=true" >> $env:GITHUB_OUTPUT
            Write-Host '変更を判定できないため、コードの変更として検証します'
          }
          else {
            $code = @($files | Where-Object { $_ -notmatch '\.md$' })
            "code=$(($code.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            Write-Host "変更 $($files.Count) 件（うちコード $($code.Count) 件）"
          }

      # .NET SDK はランナー イメージの最新版を使う（setup-dotnet は不要。イメージが C:\Program Files\dotnet を
      # PATH へ追加しているため、以降のステップでそのまま dotnet を実行できる）。
      # NuGet のグローバル パッケージ フォルダはキャッシュする（復元が最も時間を使う工程のため）。
      - name: NuGet をキャッシュ
        # 文書だけの変更では復元もビルドもしないため、1.9GB の復元は無駄になる（実測 2026-10-27: 47 秒）
        if: steps.kind.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          # 既定のグローバル パッケージ フォルダ（%USERPROFILE%\.nuget\packages）。NUGET_PACKAGES は変更しない
          path: ~/.nuget/packages
          # 参照しているパッケージが変わったときだけキャッシュを作り直す
          # （lock の内容もキーへ入れる。 同じ csproj でも lock が変われば別のキャッシュになる）
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Packages.props') }}
          # 一致するキャッシュが無い場合は直近のものから復元し、不足分だけをダウンロードさせる
          restore-keys: |
            nuget-${{ runner.os }}-

      # markdownlint は npx で取る。 キャッシュしないと毎回ダウンロードして走査が 2 分近くかかる
      # （実測 2026-10-26: 走査 125 秒。 復元済みなら 20 秒）。 走査はビルド・テストと重なるため、
      # ここが遅いとジョブ全体が遅くなる。 版は buildScript/verifyDocs.ps1 が単一所有する。
      - name: npm をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('buildScript/verifyDocs.ps1', 'buildScript/markdownlint.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 復元は検証の前に 1 回だけ行う（NuGet キャッシュを効かせ、以降を --no-restore にするため）
      # パスは設定（release-config.json）が持つため、空白を含んでいても壊れないよう引用符で囲む。
      # **lock どおりに復元する**（-p:RestoreLockedMode=true）。 csproj / Directory.Packages.props と
      # packages.lock.json が食い違えば NU1004 で失敗する（依存の版が黙って変わるのを防ぐ）。
      - name: 復元
        if: steps.kind.outputs.code == 'true'
        run: dotnet restore '${{ steps.config.outputs.solution_file }}' -p:RestoreLockedMode=true

      # 検証は buildScript/verify.ps1 が単一所有する（合否基準は .github/検証手順.md が所有者）。
      # ローカルと同じ判定を CI でも使う（手順の二重実装を作らない）。
      # -NoRestore は直前の復元を再利用するため（Release のビルド結果をテストでも使う）。
      # -FullBuild: CI の新規チェックアウトは obj が空で増分と結果が同じになるが、キャッシュの
      # 取り違えを疑う余地を残さないため明示する（実測 2026-10-27: 追加コストは約 8 秒）。
      - name: 検証（Release）
        if: steps.kind.outputs.code == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File buildScript/verify.ps1 -Solution '${{ steps.config.outputs.solution_file }}' -Configuration Release -NoRestore -FullBuild

      # **文書だけの変更**ではビルドもテストも要らない（走査だけを実行する。 直列で走らせる）。
      - name: 走査（文書のみの変更）
        if: steps.kind.outputs.code != 'true'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File buildScript/verifyDocs.ps1
          if ($LASTEXITCODE -ne 0) { throw "走査が失敗しました（exit $LASTEXITCODE）" }
