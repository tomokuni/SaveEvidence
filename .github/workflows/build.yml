# ビルドワークフロー
#
# 実行契機は次のとおり（**検証は Pull Request の 1 回だけ**）。
#   main 向け Pull Request … 検証（唯一のゲート。 必須チェックは `ci`）
#   手動実行（workflow_dispatch） … 任意のブランチで確認する場合に使用する
#
# **push では実行しない**。 `main` へ入るのは Pull Request だけであり（ruleset）、Pull Request の検証は
# **マージ後に `main` へ載るツリーそのもの**を対象にする。 同じツリーをマージ後にもう一度検証しても
# 結果は変わらないため、`dev` への push と `main` への push では実行しない（実測: 1 変更あたり
# 最大 3 回、windows ランナーが走っていた）。 作業ブランチで早く壊れを見つけたいときは、手元の
# `buildScript/verify.ps1` か workflow_dispatch を使う。
#
# **ジョブは同時に走らせる**（直列だと 1 ジョブでビルドと走査を順に待つ）。
#   verify … ビルドとテスト（走査を除く。 合否基準は .github/検証手順.md）
#   docs   … 文書とコードの走査（復元もビルドも要らない。 ubuntu で走らせる）
# 検証の中身は buildScript/verify.ps1 が単一所有し、合否基準は .github/検証手順.md が定める。
#
# **文書（.md）だけの変更ではビルドもテストも要らない**（走査だけを実行する）。
# 判定できない場合（手動実行・差分が取れない場合）は**コードの変更として扱う**（取りこぼしを避ける）。
#
# **配布物（4 UI の publish）はここでは作らない**。 Native AOT を含む重い処理であり、リリース時の
# release.yml（publish.yml）が 1 度だけ作る（規則は .github/RELEASE.md）。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# .NET SDK はランナー イメージに含まれる最新版をそのまま使う（actions/setup-dotnet を使わない）。
#
# README の「build」バッジは `?event=pull_request` を指定する（既定は**既定ブランチの最新実行**であり、
# push では実行しないため、古い push の結果が残って Pull Request の失敗を表示できない）。
name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 変更の種類を判定する
  # ────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.kind.outputs.code }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          # 変更の判定に全履歴を使う
          fetch-depth: 0

      # 判定できない場合（手動実行・base が取れない場合）は**コードの変更として扱う**（取りこぼしを避ける）。
      - name: 変更の種類を判定
        id: kind
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # core.quotepath=false: 日本語のファイル名を引用させない（引用されると `\.md$` の判定を
          # 取りこぼす）。 差分が取れなければ「コードの変更」として扱う。
          $files = $null
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_REF) {
            git fetch --no-tags origin $env:BASE_REF 2>&1 | Out-Null
            $out = @(git -c core.quotepath=false diff --name-only "origin/$($env:BASE_REF)...$($env:HEAD_SHA)" 2>&1)
            if ($LASTEXITCODE -eq 0) { $files = $out }
            else { Write-Host "git diff が終了コード $LASTEXITCODE で失敗しました（コードの変更として扱います）" }
          }

          if ($null -eq $files -or $files.Count -eq 0) {
            "code=true" >> $env:GITHUB_OUTPUT
            Write-Host '変更を判定できないため、コードの変更として検証します'
          }
          else {
            $code = @($files | Where-Object { $_ -notmatch '\.md$' })
            "code=$(($code.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            Write-Host "変更 $($files.Count) 件（うちコード $($code.Count) 件）"
          }

          # git が失敗した場合も、このステップは判定結果だけを出力して成功させる
          $global:LASTEXITCODE = 0

  # ────────────────────────────────────────────────────────────
  # 2. ビルドとテスト（`buildScript/verify.ps1` が単一所有する）
  # ────────────────────────────────────────────────────────────
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # テストが停止した場合に 6 時間（既定）待たないための上限
    timeout-minutes: 60
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # 対象のソリューション ファイルは release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # .NET SDK はランナー イメージの最新版を使う（setup-dotnet は不要）。
      # キーは「取得するパッケージの集合」で決める（csproj を混ぜると、パッケージが変わらない変更でも
      # キーが変わり、キャッシュを保存し直す）。 lock の内容も入れる（同じ csproj でも別の復元になる）。
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          # 既定のグローバル パッケージ フォルダ（%USERPROFILE%\.nuget\packages）。NUGET_PACKAGES は変更しない
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # WinUI 3 のテストは WinRT 型を使うため、テスト ホストが Windows App Runtime を機械から解決する。
      # SDK の自動初期化は既定で「見つからないとモーダル ダイアログを出す」ため、ランナーに無い版だと
      # テストが入力待ちで停止する。 規則は .github/検証手順.md §17。
      - name: Windows App Runtime を導入
        shell: pwsh
        run: pwsh -NoProfile -File buildScript/installWindowsAppRuntime.ps1

      # 復元は検証の前に 1 回だけ行う（NuGet キャッシュを効かせ、以降を --no-restore にするため）。
      # **lock どおりに復元する**（-p:RestoreLockedMode=true）。 csproj / Directory.Packages.props と
      # packages.lock.json が食い違えば NU1004 で失敗する（依存の版が黙って変わるのを防ぐ）。
      - name: 復元
        run: dotnet restore '${{ steps.config.outputs.solution_file }}' -p:RestoreLockedMode=true

      # **走査は docs ジョブが代表して 1 回だけ実行する**（-SkipDocs。 同じ検査を 2 回走らせない）。
      # -FullBuild: ゲートでは警告の取りこぼしを許さない（増分ビルドは前回の生成物を再利用するため、
      # 該当プロジェクトがスキップされて警告が隠れることがある。 規則は .github/検証手順.md §3）。
      - name: 検証（Release）
        shell: pwsh
        run: pwsh -NoProfile -File buildScript/verify.ps1 -Solution '${{ steps.config.outputs.solution_file }}' -Configuration Release -NoRestore -FullBuild -SkipDocs -SkipFormat

  # ────────────────────────────────────────────────────────────
  # 3. 文書とコードの走査（ビルドも復元も要らない。 verify と同時に走らせる）
  # ────────────────────────────────────────────────────────────
  docs:
    # **走査は Windows で実行する**: buildScript/VerifyCommon.ps1 の Invoke-NativeText は cmd.exe
    # （`$env:ComSpec`）で外部コマンドを起動するため、ubuntu では「file name has not been provided」で失敗する
    # （実測 2026-11-07）。 OS に依存しない走査へ直せたら ubuntu へ移す（節約は 1 分程度）。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # markdownlint は npx で取る（毎回ダウンロードすると 2 分近くかかる）。
      - name: npm をキャッシュ
        uses: actions/cache@v6
        with:
          # キャッシュの場所は OS で変わる（ubuntu は `~/.npm`）
          path: ~\AppData\Local\npm-cache
          # 版は buildScript/verifyDocs.ps1 が単一所有する（版を上げるとキーが変わる）
          key: npm-${{ runner.os }}-${{ hashFiles('buildScript/verifyDocs.ps1', 'buildScript/markdownlint.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 合否基準は .github/検証手順.md（実装は buildScript/verifyDocs.ps1 が単一所有する）
      - name: 走査
        shell: pwsh
        run: |
          & pwsh -NoProfile -File buildScript/verifyDocs.ps1
          if ($LASTEXITCODE -ne 0) { throw "走査が失敗しました（exit $LASTEXITCODE）" }

  # ────────────────────────────────────────────────────────────
  # 4. 必須チェックの受け皿
  # ────────────────────────────────────────────────────────────
  # 必須チェック（ruleset `Protect main`）は**このジョブ名**を要求する。
  # `verify` は条件（`if`）でスキップされ得るため、そのまま必須にするとスキップ時に
  # 「Expected」のまま残ってマージできなくなる。 常に走る集約ジョブで受ける。
  ci:
    needs: [changes, verify, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 結果を集約
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "changes=$CHANGES verify=$VERIFY docs=$DOCS"
          # スキップは「対象が無い」（文書だけの変更）なので合格にする
          for result in "$VERIFY" "$DOCS"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::検証が失敗しました（$result）"; exit 1
            fi
          done
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::変更の判定が失敗しました（$CHANGES）"; exit 1
          fi
          echo "検証はすべて合格しました。"