# ビルドワークフロー
#
# 実行契機は次のとおり。
#   main への push（マージ含む） … 必ず実行する
#   main 向け Pull Request       … 必ず実行する
#   release/** への push         … 系列ブランチ（release/<major>.<minor>）のゲートとして実行する
#   手動実行（workflow_dispatch）  … dev など他のブランチで確認する場合に使用する
#
# 復元・検証（Release）を実行する（配布物の作成と公開は行わない）。
# 検証の内容は buildScript/verify.ps1 が単一所有し、合否基準は .github/検証手順.md が定める。
#
# 本ワークフローは「検証」だけを行い、配布物の作成は release.yml が publish.yml を通じて行う。
# この実行結果はリリースの前提（ゲート）になる。Release ワークフローは、リリース対象コミットに対する
# 本ワークフローの成功実行が存在することを確認してから Release を作成する。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# dotnet の対象（ソリューション ファイル）は release-config.json の solutionFile が単一所有する。
# .NET SDK はランナー イメージに含まれる最新版をそのまま使う（actions/setup-dotnet は使わない）。
# イメージの SDK は C:\Program Files\dotnet に入り PATH も通っているため、そのまま dotnet を実行できる。
# global.json は rollForward: latestFeature のため、イメージの最新 10.0 SDK で要件を満たす。
# setup-dotnet を使うと「10.0 の最新」を取得しようとしてイメージに無い版を毎回ダウンロードする。
# キャッシュは NuGet の復元（最も時間を使う工程）だけを対象にする。
#
# テストは xunit.v3 + Microsoft.NET.Test.Sdk（VSTest）で実行するため、`dotnet test <ソリューション>` で
# 全テストプロジェクトを実行できる（Microsoft.Testing.Platform の --solution は不要）。
#
# 以降の検証ステップは verify.ps1 が実行する（復元だけを先に行い、キャッシュと --no-restore を効かせる）。
#
# Windows 専用（Win32 API の P/Invoke を含む）のため windows-latest で実行する。
#
# README の「build」バッジはこのワークフローの status を表示する（badge.svg?branch=main）。
name: Build

on:
  push:
    # main への push では必ず実行する（dev への push では実行しない。dev で確認する場合は手動実行する）
    # release/** は系列ブランチ（release/<major>.<minor>）からのバックポート時に、ゲートの Build として実行する
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  # 手動実行（dev など任意のブランチでの確認、およびバージョンコミットの検証に使用する）
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # テストが停止した場合に 6 時間（既定）待たないための上限。
    # 通常はビルド + テストで 3 分程度のため、超過は異常とみなして失敗させる
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      # 対象のソリューション ファイルは release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # .NET SDK はランナー イメージの最新版を使う（setup-dotnet は不要。イメージが C:\Program Files\dotnet を
      # PATH へ追加しているため、以降のステップでそのまま dotnet を実行できる）。
      # NuGet のグローバル パッケージ フォルダはキャッシュする（復元が最も時間を使う工程のため）。
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          # 既定のグローバル パッケージ フォルダ（%USERPROFILE%\.nuget\packages）。NUGET_PACKAGES は変更しない
          path: ~/.nuget/packages
          # 参照しているパッケージが変わったときだけキャッシュを作り直す
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          # 一致するキャッシュが無い場合は直近のものから復元し、不足分だけをダウンロードさせる
          restore-keys: |
            nuget-${{ runner.os }}-

      # 復元は検証の前に 1 回だけ行う（NuGet キャッシュを効かせ、以降を --no-restore にするため）
      # パスは設定（release-config.json）が持つため、空白を含んでいても壊れないよう引用符で囲む
      - name: 復元
        run: dotnet restore '${{ steps.config.outputs.solution_file }}'

      # 検証は buildScript/verify.ps1 が単一所有する（合否基準は .github/検証手順.md が所有者）。
      # ローカルと同じ判定を CI でも使う（手順の二重実装を作らない）。
      # -NoRestore は直前の復元を再利用するため（Release のビルド結果をテストでも使う）。
      - name: 検証（Release）
        shell: pwsh
        run: pwsh -NoProfile -File buildScript/verify.ps1 -Solution '${{ steps.config.outputs.solution_file }}' -Configuration Release -NoRestore
